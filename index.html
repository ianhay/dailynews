<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>dailynews</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root{
    --bg:#0b1016;
    --panel:#121924;
    --hair:#2c3a4a;
    --ink:#e8ecf1;
    --ink-dim:#a9b8c6;
    --amber:#e8a33d;
    --blue:#6ba3d6;
    --pol:#6ba3d6;
    --aus:#d1a92e;
    --eco:#7fae7f;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:28px;}

  /* ---- Wire ticker header ---- */
  .ticker{
    background:linear-gradient(180deg,#161f2a,#101720);
    border-bottom:1px solid var(--hair);
    padding:7px 14px;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:.03em;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:50;
  }
  .ticker .left{color:var(--ink-dim);}
  .ticker .cursor{display:inline-block;width:7px;height:12px;background:var(--amber);margin-left:4px;animation:blink 1.1s steps(1) infinite;vertical-align:-2px;}
  @keyframes blink{50%{opacity:0;}}
  .refresh-icon{
    background:none;border:1px solid var(--hair);color:var(--blue);
    font-size:20px;line-height:1;width:68px;height:34px;border-radius:4px;
    cursor:pointer;flex-shrink:0;
  }
  .refresh-icon:active{background:var(--hair);}
  #tickerStatus{margin-left:auto;}
  .masthead{
    padding:6px 16px;
    border-bottom:1px solid var(--hair);
  }
  .brief-line{
    font-family:var(--sans);
    font-size:12.5px;
    color:var(--ink-dim);
    display:flex;
    align-items:baseline;
    gap:6px;
    flex-wrap:wrap;
  }
  .brief-line .brand{
    font-family:var(--sans);
    font-weight:800;
    font-size:15px;
    color:var(--ink);
    letter-spacing:.01em;
  }
  .brief-line .dot{color:var(--hair);}
  .brief-line .lo{color:var(--blue);}
  .brief-line .hi{color:#d47b5f;}

  /* ---- Map ---- */
  #map{height:230px;width:100%;border-bottom:1px solid var(--hair);}
  .maplibregl-popup-content{background:#1a2330;color:var(--ink);border-radius:4px;font-family:var(--sans);font-size:13.5px;line-height:1.4;padding:10px 12px;}
  .maplibregl-popup-tip{border-top-color:#1a2330;border-bottom-color:#1a2330;}
  .maplibregl-popup-content a{color:var(--blue);}
  .maplibregl-popup-close-button{color:var(--ink-dim);font-size:16px;}
  .map-cap{
    font-family:var(--sans);font-size:10.5px;color:var(--ink-dim);
    padding:6px 16px;letter-spacing:.04em;text-transform:uppercase;
    border-bottom:1px solid var(--hair);
  }

  /* ---- Sections ---- */
  section.desk{padding:14px 16px 4px;}
  .desk-head{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .chip{width:9px;height:9px;border-radius:1px;flex-shrink:0;}
  .chip.pol{background:var(--pol);}
  .chip.aus{background:var(--aus);}
  .chip.eco{background:var(--eco);}
  .desk-head h2{
    font-family:var(--sans);
    font-size:13px;
    letter-spacing:.1em;
    text-transform:uppercase;
    font-weight:700;
    margin:0;
    color:var(--ink);
  }

  .story{
    border-top:1px solid var(--hair);
    padding:9px 0;
  }
  .story:last-child{padding-bottom:2px;}
  .story .src-tag{
    display:block;
    font-family:var(--sans);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--blue);
    text-decoration:none;
    margin-bottom:3px;
  }
  .story a.headline{
    font-family:var(--sans);
    font-size:16.5px;
    line-height:1.3;
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
  }
  .story a.headline:hover{color:var(--amber);}
  .story .summary{
    font-size:13.5px;
    color:var(--ink-dim);
    line-height:1.4;
    margin-top:3px;
  }

  .empty, .loading{
    font-family:var(--sans);font-size:12px;color:var(--ink-dim);
    padding:14px 0;
  }
  .loading::after{content:'';display:inline-block;width:6px;height:6px;background:var(--amber);margin-left:6px;animation:blink 1s steps(1) infinite;}

  footer{
    margin-top:16px;padding:14px 16px 6px;
    font-family:var(--sans);font-size:10.5px;color:var(--ink-dim);
    border-top:1px solid var(--hair);line-height:1.6;
  }
  footer a{color:var(--ink-dim);}
</style>
</head>
<body>

  <div class="ticker">
    <button class="refresh-icon" onclick="location.reload()" aria-label="Refresh wire" title="Refresh wire">&#8635;</button>
    <span class="left" id="tickerDate">LOADING</span>
    <span id="tickerStatus">SYNC<span class="cursor"></span></span>
  </div>

  <div class="masthead">
    <div class="brief-line">
      <span class="brand">dailynews</span>
      <span class="dot">&middot;</span>
      <span id="locLine">Locating&hellip;</span>
      <span class="dot">&middot;</span>
      <span class="lo" id="statLo">&mdash;</span><span>/</span><span class="hi" id="statHi">&mdash;</span>
    </div>
  </div>

  <div id="map"></div>
  <div class="map-cap" id="mapCap">Top 5 datelines in view &mdash; pan or zoom to see other regions</div>

  <section class="desk">
    <div class="desk-head"><span class="chip pol"></span><h2>Politics</h2></div>
    <div id="polList" class="loading">Pulling wire</div>
  </section>

  <section class="desk">
    <div class="desk-head"><span class="chip aus"></span><h2>Australia</h2></div>
    <div id="ausList" class="loading">Pulling wire</div>
  </section>

  <section class="desk">
    <div class="desk-head"><span class="chip eco"></span><h2>Economy</h2></div>
    <div id="ecoList" class="loading">Pulling wire</div>
  </section>

  <footer>
    <span id="sourcesLine">Sources: connecting&hellip;</span><br>
    Weather: Open&#8209;Meteo. Location: browser geolocation + BigDataCloud reverse geocoding.
  </footer>

<script>
window.addEventListener('error', function(e){
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#5c1414;color:#f5d6d6;padding:8px 12px;font-family:monospace;font-size:11px;line-height:1.5;border-bottom:1px solid #a33;';
  banner.textContent = 'Script error: ' + e.message + ' (line ' + e.lineno + ')';
  document.body.insertBefore(banner, document.body.firstChild);
});
</script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
/* ---------------------------------------------------------------
   DAILYNEWS — single file dashboard
   News data comes from ./news.json, written server-side by
   scripts/fetch_news.py via a scheduled GitHub Action. No CORS
   proxies, no fabricated content: failures are reported honestly.
------------------------------------------------------------------*/

const FALLBACK_COORDS = { lat: -31.9772, lon: 115.8756, label: "Perth, Western Australia" };

// ---------- Date ticker ----------
(function(){
  const d = new Date();
  const opts = { weekday:'short', year:'numeric', month:'short', day:'numeric' };
  document.getElementById('tickerDate').textContent = d.toLocaleDateString('en-AU', opts).toUpperCase();
})();

// ---------- Map init (MapLibre GL, dark raster basemap) ----------
let map, mapReady = false;
let allPlaces = [];
let currentMarkers = [];

try{
  map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        'carto-dark': {
          type: 'raster',
          tiles: [
            'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            'https://c.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            'https://d.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
          ],
          tileSize: 256,
          attribution: '&copy; OpenStreetMap &copy; CARTO'
        }
      },
      layers: [{ id:'carto-dark-layer', type:'raster', source:'carto-dark' }]
    },
    center: [20, 20],
    zoom: 1,
    attributionControl: true
  });
  map.scrollZoom.disable();
  map.addControl(new maplibregl.NavigationControl({ showCompass:false }), 'bottom-right');
  map.on('load', ()=>{ mapReady = true; renderVisiblePlaces(); });
  map.on('moveend', renderVisiblePlaces);
}catch(e){
  document.getElementById('mapCap').textContent = 'Map failed to load: ' + e.message;
}

function clearMarkers(){
  currentMarkers.forEach(m=>m.remove());
  currentMarkers = [];
}

function renderVisiblePlaces(){
  if(!map || !mapReady || !allPlaces.length) return;
  const bounds = map.getBounds();
  const visible = allPlaces
    .filter(p => bounds.contains([p.lon, p.lat]))
    .sort((a,b)=>b.count-a.count)
    .slice(0,5);

  clearMarkers();

  if(!visible.length){
    document.getElementById('mapCap').textContent = 'No dateline mentions in the current view &mdash; pan or zoom to another region.';
    return;
  }

  visible.forEach((p, i)=>{
    const el = document.createElement('div');
    el.style.cssText = `background:#e8a33d;color:#0b1016;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px sans-serif;border:2px solid #0b1016;box-shadow:0 0 0 1px #e8a33d;cursor:pointer;`;
    el.textContent = i + 1;
    const link = p.story ? `<a href="${p.story.link}" target="_blank" rel="noopener">${escapeHtml(p.story.title)}</a>` : '';
    const popup = new maplibregl.Popup({ offset: 14 }).setHTML(
      `<strong>${escapeHtml(p.name)}</strong><br>${p.count} mention${p.count>1?'s':''} in view<br>${link}`
    );
    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([p.lon, p.lat])
      .setPopup(popup)
      .addTo(map);
    currentMarkers.push(marker);
  });

  document.getElementById('mapCap').innerHTML = 'Top 5 datelines in view &mdash; tap a marker for the source story';
}

function fitToTopPlaces(places){
  if(!places.length) return;
  const lons = places.map(p=>p.lon), lats = places.map(p=>p.lat);
  const bounds = [[Math.min(...lons), Math.min(...lats)], [Math.max(...lons), Math.max(...lats)]];
  map.fitBounds(bounds, { padding:40, maxZoom:5, duration:0 });
}

// ---------- Location + weather ----------
async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const j = await r.json();
    const city = j.city || j.locality || j.principalSubdivision || '';
    const region = j.principalSubdivision || j.countryName || '';
    return city && region && city !== region ? `${city}, ${region}` : (city || region || `${lat.toFixed(2)}, ${lon.toFixed(2)}`);
  }catch(e){ return `${lat.toFixed(2)}, ${lon.toFixed(2)}`; }
}

async function loadWeather(lat, lon, label){
  document.getElementById('locLine').textContent = label;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
    const r = await fetch(url);
    const j = await r.json();
    const hi = Math.round(j.daily.temperature_2m_max[0]);
    const lo = Math.round(j.daily.temperature_2m_min[0]);
    document.getElementById('statHi').textContent = hi + '°';
    document.getElementById('statLo').textContent = lo + '°';
  }catch(e){
    document.getElementById('statHi').textContent = 'n/a';
    document.getElementById('statLo').textContent = 'n/a';
  }
}

function initLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      const {latitude:lat, longitude:lon} = pos.coords;
      const label = await reverseGeocode(lat, lon);
      loadWeather(lat, lon, label);
    }, async ()=>{
      loadWeather(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon, FALLBACK_COORDS.label);
    }, { timeout:6000 });
  } else {
    loadWeather(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon, FALLBACK_COORDS.label);
  }
}
try{ initLocation(); }catch(e){ console.error(e); }

// ---------- News: read the static news.json built by GitHub Actions ----------
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList(elId, stories){
  const el = document.getElementById(elId);
  if(!stories || !stories.length){
    el.innerHTML = '<div class="empty">No matching stories in the latest pull.</div>';
    return;
  }
  el.innerHTML = stories.map(s=>`
    <div class="story">
      <a class="src-tag" href="${s.link}" target="_blank" rel="noopener">${escapeHtml(s.source)}</a>
      <a class="headline" href="${s.link}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>
      <div class="summary">${escapeHtml(s.description)}${(s.description||'').length>=200?'&hellip;':''}</div>
    </div>
  `).join('');
}

function timeAgo(iso){
  const then = new Date(iso).getTime();
  const mins = Math.round((Date.now() - then) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins/60);
  return `${hrs}h ago`;
}

async function loadWire(){
  try{
    const r = await fetch('./news.json', { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    const sourcesLineEl = document.getElementById('sourcesLine');
    const okNames = data.sources_ok || [];
    const failed = data.sources_failed || [];
    let line = okNames.length ? `Sources: ${okNames.join(', ')}` : 'No sources reachable on the last run';
    if(failed.length) line += ` &mdash; unreachable last run: ${failed.map(f=>f.name).join(', ')}`;
    line += ` &mdash; updated ${timeAgo(data.generated_at)}`;
    sourcesLineEl.innerHTML = line;
    document.getElementById('tickerStatus').innerHTML = 'LIVE<span class="cursor"></span>';

    renderList('polList', data.political);
    renderList('ausList', data.australia);
    renderList('ecoList', data.economy);

    allPlaces = (data.places || []).slice();
    if(mapReady){
      fitToTopPlaces(allPlaces.slice(0,5));
      renderVisiblePlaces();
    } else if(map){
      map.once('load', ()=>{ fitToTopPlaces(allPlaces.slice(0,5)); renderVisiblePlaces(); });
    }
  }catch(e){
    document.getElementById('sourcesLine').textContent = 'Could not load news.json: ' + e.message;
    ['polList','ausList','ecoList'].forEach(id=>{
      document.getElementById(id).innerHTML = '<div class="empty">news.json not found yet. If you just set this up, open the Actions tab in your repo, run "Update news feed" once manually, then refresh this page.</div>';
    });
    document.getElementById('mapCap').textContent = 'Map unavailable — news.json not found.';
  }
}

loadWire().catch(e=>console.error(e));
</script>
</body>
</html>
