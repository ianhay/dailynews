<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>World Wire</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0d1210;
    --panel:#141b18;
    --panel-2:#182019;
    --hair:#26312b;
    --ink:#e9e6dc;
    --ink-dim:#8fa197;
    --amber:#e8a33d;
    --pol:#7ea0c4;
    --aus:#d1a92e;
    --eco:#7fae7f;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --serif: 'Georgia', 'Iowan Old Style', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);}
  body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:28px;}

  /* ---- Wire ticker header ---- */
  .ticker{
    background:linear-gradient(180deg,#171f1a,#11160f);
    border-bottom:1px solid var(--hair);
    padding:7px 14px;
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.03em;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:10px;
    position:sticky;
    top:0;
    z-index:50;
  }
  .ticker .left{color:var(--ink-dim);}
  .ticker .cursor{display:inline-block;width:7px;height:12px;background:var(--amber);margin-left:4px;animation:blink 1.1s steps(1) infinite;vertical-align:-2px;}
  @keyframes blink{50%{opacity:0;}}
  .refresh-icon{
    background:none;border:1px solid var(--hair);color:var(--amber);
    font-size:20px;line-height:1;width:34px;height:34px;border-radius:4px;
    cursor:pointer;flex-shrink:0;
  }
  .refresh-icon:active{background:var(--hair);}
  #tickerStatus{margin-left:auto;}
  .masthead{
    padding:6px 16px;
    border-bottom:1px solid var(--hair);
  }
  .brief-line{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-dim);
    display:flex;
    align-items:baseline;
    gap:6px;
    flex-wrap:wrap;
  }
  .brief-line .brand{
    font-family:var(--serif);
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    letter-spacing:.01em;
  }
  .brief-line .dot{color:var(--hair);}
  .brief-line .lo{color:#6f9bc4;}
  .brief-line .hi{color:#d47b5f;}

  /* ---- Map ---- */
  #map{height:230px;width:100%;border-bottom:1px solid var(--hair);filter:saturate(1.05);}
  .leaflet-popup-content-wrapper{background:#1b2420;color:var(--ink);border-radius:3px;}
  .leaflet-popup-tip{background:#1b2420;}
  .leaflet-popup-content{font-family:var(--sans);font-size:12.5px;margin:9px 11px;line-height:1.4;}
  .leaflet-popup-content a{color:var(--amber);}
  .leaflet-container a.leaflet-popup-close-button{color:var(--ink-dim);}
  .map-cap{
    font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);
    padding:6px 16px;letter-spacing:.06em;text-transform:uppercase;
    border-bottom:1px solid var(--hair);
  }

  /* ---- Sections ---- */
  section.desk{padding:14px 16px 4px;}
  .desk-head{
    display:flex;align-items:center;gap:8px;margin-bottom:8px;
  }
  .chip{width:9px;height:9px;border-radius:1px;flex-shrink:0;}
  .chip.pol{background:var(--pol);}
  .chip.aus{background:var(--aus);}
  .chip.eco{background:var(--eco);}
  .desk-head h2{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin:0;
    color:var(--ink);
  }
  .desk-head .n{color:var(--ink-dim);font-family:var(--mono);font-size:10.5px;margin-left:auto;}

  .story{
    border-top:1px solid var(--hair);
    padding:9px 0;
  }
  .story:last-child{padding-bottom:2px;}
  .story a.headline{
    font-family:var(--serif);
    font-size:15.5px;
    line-height:1.3;
    color:var(--ink);
    text-decoration:none;
    font-weight:700;
  }
  .story a.headline:hover{color:var(--amber);}
  .story .summary{
    font-size:12.5px;
    color:var(--ink-dim);
    line-height:1.4;
    margin-top:3px;
  }
  .story .meta{
    font-family:var(--mono);
    font-size:9.5px;
    color:var(--ink-dim);
    margin-top:4px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .story .meta a{color:var(--ink-dim);}

  .empty, .loading{
    font-family:var(--mono);font-size:11px;color:var(--ink-dim);
    padding:14px 0;
  }
  .loading::after{content:'';display:inline-block;width:6px;height:6px;background:var(--amber);margin-left:6px;animation:blink 1s steps(1) infinite;}

  footer{
    margin-top:16px;padding:14px 16px 6px;
    font-family:var(--mono);font-size:9.5px;color:var(--ink-dim);
    border-top:1px solid var(--hair);line-height:1.6;
  }
  footer a{color:var(--ink-dim);}
  .refresh-btn{
    font-family:var(--mono);font-size:10.5px;color:var(--bg);
    background:var(--amber);border:none;padding:6px 10px;border-radius:2px;
    letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:8px;
  }
</style>
</head>
<body>

  <div class="ticker">
    <button class="refresh-icon" onclick="location.reload()" aria-label="Refresh wire" title="Refresh wire">&#8635;</button>
    <span class="left" id="tickerDate">LOADING</span>
    <span id="tickerStatus">SYNC<span class="cursor"></span></span>
  </div>

  <div class="masthead">
    <div class="brief-line">
      <span class="brand">World Wire</span>
      <span class="dot">&middot;</span>
      <span id="locLine">Locating&hellip;</span>
      <span class="dot">&middot;</span>
      <span class="lo" id="statLo">&mdash;</span><span>/</span><span class="hi" id="statHi">&mdash;</span>
    </div>
  </div>

  <div id="map"></div>
  <div class="map-cap" id="mapCap">Top 5 datelines &mdash; live mentions across wire feeds</div>

  <section class="desk">
    <div class="desk-head"><span class="chip pol"></span><h2>Politics</h2><span class="n" id="polN"></span></div>
    <div id="polList" class="loading">Pulling wire</div>
  </section>

  <section class="desk">
    <div class="desk-head"><span class="chip aus"></span><h2>Australia</h2><span class="n" id="ausN"></span></div>
    <div id="ausList" class="loading">Pulling wire</div>
  </section>

  <section class="desk">
    <div class="desk-head"><span class="chip eco"></span><h2>Economy</h2><span class="n" id="ecoN"></span></div>
    <div id="ecoList" class="loading">Pulling wire</div>
  </section>

  <footer>
    <span id="sourcesLine">Sources: connecting&hellip;</span><br>
    Weather: Open&#8209;Meteo. Location: browser geolocation + BigDataCloud reverse geocoding.
  </footer>

<script>
window.addEventListener('error', function(e){
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#5c1414;color:#f5d6d6;padding:8px 12px;font-family:monospace;font-size:11px;line-height:1.5;border-bottom:1px solid #a33;';
  banner.textContent = 'Script error: ' + e.message + ' (line ' + e.lineno + ')';
  document.body.insertBefore(banner, document.body.firstChild);
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ---------------------------------------------------------------
   WORLD WIRE — single file dashboard
   All data fetched client-side at load time. No fabricated content:
   if a live source fails, that section reports the failure honestly
   instead of showing placeholder headlines.
------------------------------------------------------------------*/

const FALLBACK_COORDS = { lat: -31.9772, lon: 115.8756, label: "Perth, Western Australia" };

// ---------- Date ticker ----------
(function(){
  const d = new Date();
  const opts = { weekday:'short', year:'numeric', month:'short', day:'numeric' };
  document.getElementById('tickerDate').textContent = d.toLocaleDateString('en-AU', opts).toUpperCase();
})();

// ---------- Map init ----------
let map;
try{
  map = L.map('map', { zoomControl:false, attributionControl:true, scrollWheelZoom:false })
    .setView([20, 20], 2);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 18
  }).addTo(map);
  L.control.zoom({ position:'bottomright' }).addTo(map);
}catch(e){
  document.getElementById('mapCap').textContent = 'Map failed to load: ' + e.message;
}

// ---------- Location + weather ----------
async function reverseGeocode(lat, lon){
  try{
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`);
    const j = await r.json();
    const city = j.city || j.locality || j.principalSubdivision || '';
    const region = j.principalSubdivision || j.countryName || '';
    return city && region && city !== region ? `${city}, ${region}` : (city || region || `${lat.toFixed(2)}, ${lon.toFixed(2)}`);
  }catch(e){ return `${lat.toFixed(2)}, ${lon.toFixed(2)}`; }
}

async function loadWeather(lat, lon, label){
  document.getElementById('locLine').textContent = label;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
    const r = await fetch(url);
    const j = await r.json();
    const hi = Math.round(j.daily.temperature_2m_max[0]);
    const lo = Math.round(j.daily.temperature_2m_min[0]);
    document.getElementById('statHi').textContent = hi + '°';
    document.getElementById('statLo').textContent = lo + '°';
    document.getElementById('tickerStatus').innerHTML = 'LIVE<span class="cursor"></span>';
  }catch(e){
    document.getElementById('statHi').textContent = 'n/a';
    document.getElementById('statLo').textContent = 'n/a';
  }
}

function initLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async pos=>{
      const {latitude:lat, longitude:lon} = pos.coords;
      const label = await reverseGeocode(lat, lon);
      loadWeather(lat, lon, label);
    }, async ()=>{
      loadWeather(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon, FALLBACK_COORDS.label);
    }, { timeout:6000 });
  } else {
    loadWeather(FALLBACK_COORDS.lat, FALLBACK_COORDS.lon, FALLBACK_COORDS.label);
  }
}
try{ initLocation(); }catch(e){ console.error(e); }

// ---------- News: read the static news.json built by GitHub Actions ----------
// (scripts/fetch_news.py runs on a schedule server-side and writes this file —
// no browser CORS/proxy involved, which is what makes this reliable.)

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList(elId, countId, stories){
  const el = document.getElementById(elId);
  if(!stories || !stories.length){
    el.innerHTML = '<div class="empty">No matching stories in the latest pull.</div>';
    document.getElementById(countId).textContent = '';
    return;
  }
  document.getElementById(countId).textContent = stories.length + ' of 3';
  el.innerHTML = stories.map(s=>`
    <div class="story">
      <a class="headline" href="${s.link}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>
      <div class="summary">${escapeHtml(s.description)}${(s.description||'').length>=200?'&hellip;':''}</div>
      <div class="meta"><a href="${s.link}" target="_blank" rel="noopener">${s.source}</a></div>
    </div>
  `).join('');
}

function plotPlaces(places){
  if(!map){ document.getElementById('mapCap').textContent = 'Map unavailable.'; return; }
  if(!places || !places.length){
    document.getElementById('mapCap').textContent = 'No dateline data available from the latest pull.';
    return;
  }
  const markerColor = '#e8a33d';
  places.forEach((p, i)=>{
    const icon = L.divIcon({
      className:'',
      html:`<div style="background:${markerColor};color:#0d1210;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px monospace;border:2px solid #0d1210;box-shadow:0 0 0 1px ${markerColor};">${i+1}</div>`,
      iconSize:[22,22], iconAnchor:[11,11]
    });
    const m = L.marker([p.lat, p.lon], {icon}).addTo(map);
    const link = p.story ? `<a href="${p.story.link}" target="_blank" rel="noopener">${escapeHtml(p.story.title)}</a>` : '';
    m.bindPopup(`<strong>${p.name}</strong><br>${p.count} mention${p.count>1?'s':''} in latest pull<br>${link}`);
  });
  const bounds = L.latLngBounds(places.map(p=>[p.lat, p.lon]));
  map.fitBounds(bounds, { padding:[30,30], maxZoom:5 });
  document.getElementById('mapCap').innerHTML = 'Top 5 datelines by mention count &mdash; tap a marker for the source story';
}

function timeAgo(iso){
  const then = new Date(iso).getTime();
  const mins = Math.round((Date.now() - then) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return `${mins}m ago`;
  const hrs = Math.round(mins/60);
  return `${hrs}h ago`;
}

async function loadWire(){
  try{
    const r = await fetch('./news.json', { cache: 'no-store' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();

    const sourcesLineEl = document.getElementById('sourcesLine');
    const okNames = data.sources_ok || [];
    const failed = data.sources_failed || [];
    let line = okNames.length ? `Sources: ${okNames.join(', ')}` : 'No sources reachable on the last run';
    if(failed.length) line += ` &mdash; unreachable last run: ${failed.map(f=>f.name).join(', ')}`;
    line += ` &mdash; updated ${timeAgo(data.generated_at)}`;
    sourcesLineEl.innerHTML = line;
    document.getElementById('tickerStatus').innerHTML = 'LIVE<span class="cursor"></span>';

    renderList('polList', 'polN', data.political);
    renderList('ausList', 'ausN', data.australia);
    renderList('ecoList', 'ecoN', data.economy);
    plotPlaces(data.places);
  }catch(e){
    document.getElementById('sourcesLine').textContent = 'Could not load news.json: ' + e.message;
    ['polList','ausList','ecoList'].forEach(id=>{
      document.getElementById(id).innerHTML = '<div class="empty">news.json not found yet. If you just set this up, open the Actions tab in your repo, run "Update news feed" once manually, then refresh this page.</div>';
    });
    document.getElementById('mapCap').textContent = 'Map unavailable — news.json not found.';
  }
}

loadWire().catch(e=>console.error(e));
</script>
</body>
</html>
