name: Update news feed

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches: [ main ]
    paths:
      - "scripts/fetch_news.py"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Fetch news and write news.json
        run: python scripts/fetch_news.py

      - name: Commit news.json if it changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "Update news.json [automated]"
          git push
